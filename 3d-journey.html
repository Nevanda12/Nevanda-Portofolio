<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevan | Advanced 3D Portfolio</title>
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg: #030305; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* Loading Screen */
        #loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: opacity 1s ease-out; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(0, 242, 254, 0.3); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Canvas & UI */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; outline: none; }
        main { position: relative; z-index: 10; pointer-events: none; }
        
        /* Custom Cursor */
        #cursor { position: fixed; width: 20px; height: 20px; border: 2px solid var(--primary); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 999; transition: width 0.2s, height 0.2s, background 0.2s; mix-blend-mode: difference; }
        body:hover #cursor { width: 40px; height: 40px; background: rgba(0, 242, 254, 0.2); }

        /* Sections */
        section { height: 150vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; box-sizing: border-box; }
        .content-box { background: rgba(10, 10, 15, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); padding: 3rem; border-radius: 24px; max-width: 600px; transform: translateY(50px); opacity: 0; transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; position: relative; overflow: hidden; }
        .content-box::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(0, 242, 254, 0.1), transparent); transform: skewX(-20deg); animation: shine 6s infinite; }
        @keyframes shine { 100% { left: 200%; } }
        
        section.visible .content-box { transform: translateY(0); opacity: 1; }
        
        h1 { font-size: 4rem; margin: 0 0 1rem 0; font-weight: 800; line-height: 1.1; background: linear-gradient(135deg, #fff 0%, #888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .highlight { color: var(--primary); -webkit-text-fill-color: var(--primary); text-shadow: 0 0 20px rgba(0,242,254,0.4); }
        p { font-size: 1.1rem; line-height: 1.8; color: #a0a0b0; margin-bottom: 2rem; }
        .tech-stack span { display: inline-block; padding: 6px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; font-size: 0.85rem; margin: 0 8px 8px 0; letter-spacing: 1px; }
        
        /* Scroll Tracker */
        .progress-ring { position: fixed; bottom: 30px; right: 30px; z-index: 100; width: 60px; height: 60px; }
        .progress-ring circle { fill: transparent; stroke: rgba(255,255,255,0.1); stroke-width: 2; }
        .progress-ring .progress { stroke: var(--primary); stroke-dasharray: 176; stroke-dashoffset: 176; transition: stroke-dashoffset 0.1s; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <a href="index.html" style="position: fixed; top: 20px; left: 20px; z-index: 1000; color: white; text-decoration: none; font-family: monospace; border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 50px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
        ← Back to Reality
    </a>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-family: monospace; letter-spacing: 2px;">FLYING THROUGH LIMITLESS EXPERIENCESS...</p>
    </div>

    <div id="cursor"></div>

    <svg class="progress-ring"><circle cx="30" cy="30" r="28"></circle><circle class="progress" cx="30" cy="30" r="28"></circle></svg>

    <canvas id="webgl"></canvas>

    <main id="scroll-container">
        <section id="sec-0">
            <div class="content-box" style="padding: 1.5rem; max-width: 600px; text-align: center;">
                <img src="assets/certificate.png" alt="Sertifikat 1" style="width: 100%; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2); border: 1px solid rgba(255,255,255,0.1); transition: transform 0.5s;">
                <h2 style="margin: 20px 0 5px 0; font-size: 1.8rem; color: var(--primary); letter-spacing: 2px;">CodeSignal</h2>
                <p style="font-size: 0.9rem; margin: 0; color: #aaa;">Programming Foundation With Python</p>
            </div>
        </section>

        <section id="sec-1">
            <div class="content-box" style="padding: 1.5rem; max-width: 600px; text-align: center; margin-left: auto;">
                <img src="assets/dicoding.jpg" alt="Sertifikat 2" style="width: 100%; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2); border: 1px solid rgba(255,255,255,0.1); filter: hue-rotate(45deg);">
                <h2 style="margin: 20px 0 5px 0; font-size: 1.8rem; color: var(--primary); letter-spacing: 2px;">Dicoding</h2>
                <p style="font-size: 0.9rem; margin: 0; color: #aaa;">Building Generative AI Applications With Microsoft Azure</p>
            </div>
        </section>

        <section id="sec-2">
            <div class="content-box" style="padding: 1.5rem; max-width: 600px; text-align: center;">
                <img src="assets/freecode.jpg" alt="Sertifikat 3" style="width: 100%; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2); border: 1px solid rgba(255,255,255,0.1); filter: hue-rotate(90deg);">
                <h2 style="margin: 20px 0 5px 0; font-size: 1.8rem; color: var(--primary); letter-spacing: 2px;">FreeCodeCamp</h2>
                <p style="font-size: 0.9rem; margin: 0; color: #aaa;">Frontend Development Library</p>
            </div>
        </section>

        <section id="sec-3">
            <div class="content-box" style="padding: 1.5rem; max-width: 600px; text-align: center; margin-left: auto;">
                <img src="assets/pbi.jpg" alt="Sertifikat 4" style="width: 100%; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2); border: 1px solid rgba(255,255,255,0.1); filter: hue-rotate(180deg);">
                <h2 style="margin: 20px 0 5px 0; font-size: 1.8rem; color: var(--primary); letter-spacing: 2px;">EVERMOS INTERNSHIP</h2>
                <p style="font-size: 0.9rem; margin: 0; color: #aaa;">Backend Engineering Achievement</p>
            </div>
        </section>
    </main>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 1. CORE SETUP ---
        const canvas = document.querySelector('#webgl');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        // --- 2. POST PROCESSING (BLOOM EFFECT) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2; 
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 3. THE SPLINE PATH (JALUR KAMERA) ---
        const points = [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(10, 5, -50),
            new THREE.Vector3(-15, -10, -100),
            new THREE.Vector3(20, 15, -150),
            new THREE.Vector3(-5, -5, -200),
            new THREE.Vector3(0, 0, -250)
        ];
        const curve = new THREE.CatmullRomCurve3(points);
        curve.tension = 0.5;

        const tubeGeo = new THREE.TubeGeometry(curve, 100, 2, 8, false);
        const tubeMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true, transparent: true, opacity: 0.1 });
        const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(tubeMesh);

        // --- 4. DATA NODES (OBJEK INTERAKTIF) & CUSTOM SHADERS ---
        const interactiveMeshes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const customShaderMaterial = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vPosition;
                uniform float time;
                void main() {
                    vUv = uv;
                    vPosition = position;
                    vec3 pos = position;
                    pos.x += sin(pos.y * 5.0 + time) * 0.2;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                varying vec3 vPosition;
                uniform float time;
                void main() {
                    vec3 color1 = vec3(0.0, 0.95, 1.0);
                    vec3 color2 = vec3(0.3, 0.1, 0.8);
                    float mixValue = sin(vPosition.y * 2.0 + time) * 0.5 + 0.5;
                    gl_FragColor = vec4(mix(color1, color2, mixValue), 0.8);
                }
            `,
            wireframe: true,
            transparent: true
        });

        const nodeGeometries = [
            new THREE.IcosahedronGeometry(3, 1),
            new THREE.TorusKnotGeometry(2, 0.5, 100, 16),
            new THREE.OctahedronGeometry(3, 0),
            new THREE.TetrahedronGeometry(3, 1)
        ];

        for(let i = 0; i < 4; i++) {
            const pointOnCurve = curve.getPointAt((i + 1) * 0.2); 
            
            const mesh = new THREE.Mesh(nodeGeometries[i], customShaderMaterial.clone());
            mesh.position.copy(pointOnCurve);
            
            mesh.position.x += (i % 2 === 0 ? 8 : -8);
            mesh.position.y += (Math.random() - 0.5) * 5;

            mesh.userData = { originalScale: mesh.scale.x, isHovered: false };
            
            scene.add(mesh);
            interactiveMeshes.push(mesh);
        }

        // --- 5. INSTANCED MESH (PARTIKEL DEBU DATA) ---
        const particleCount = 2000;
        const particleGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const instancedParticles = new THREE.InstancedMesh(particleGeo, particleMat, particleCount);
        
        const dummy = new THREE.Object3D();
        for(let i=0; i<particleCount; i++) {
            dummy.position.set(
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100,
                (Math.random() - 1.0) * 300
            );
            dummy.rotation.set(Math.random(), Math.random(), Math.random());
            dummy.updateMatrix();
            instancedParticles.setMatrixAt(i, dummy.matrix);
        }
        scene.add(instancedParticles);

        // --- 6. INTERACTIVITY & EVENTS ---
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const cursor = document.getElementById('cursor');
            cursor.style.left = event.clientX + 'px';
            cursor.style.top = event.clientY + 'px';
        });

        let scrollFraction = 0;
        const sections = document.querySelectorAll('section');
        const progressCircle = document.querySelector('.progress');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.5 });
        sections.forEach(sec => observer.observe(sec));

        window.addEventListener('scroll', () => {
            const maxScroll = document.body.scrollHeight - window.innerHeight;
            scrollFraction = window.scrollY / maxScroll;
            
            const offset = 176 - (scrollFraction * 176);
            progressCircle.style.strokeDashoffset = offset;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 1000);
            }, 1500);
        };

        // --- 7. THE ANIMATION ENGINE ---
        const clock = new THREE.Clock();
        let targetLookAt = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            const safeScroll = Math.min(Math.max(scrollFraction, 0.001), 0.99);
            const camPos = curve.getPointAt(safeScroll);
            const camTarget = curve.getPointAt(Math.min(safeScroll + 0.05, 1.0));

            camera.position.lerp(camPos, 0.05);
            
            camTarget.x += mouse.x * 2;
            camTarget.y += mouse.y * 2;
            targetLookAt.lerp(camTarget, 0.05);
            camera.lookAt(targetLookAt);

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveMeshes);
            
            interactiveMeshes.forEach(mesh => {
                mesh.userData.isHovered = false;
                mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            });

            if (intersects.length > 0) {
                const hoveredMesh = intersects[0].object;
                hoveredMesh.userData.isHovered = true;
                hoveredMesh.scale.lerp(new THREE.Vector3(1.5, 1.5, 1.5), 0.1);
                document.getElementById('cursor').style.background = 'rgba(255, 255, 255, 0.8)';
            } else {
                document.getElementById('cursor').style.background = 'transparent';
            }

            interactiveMeshes.forEach((mesh, index) => {
                mesh.rotation.x += delta * 0.5;
                mesh.rotation.y += delta * 0.3;
                if(mesh.material.uniforms) {
                    mesh.material.uniforms.time.value = time + index;
                }
            });

            tubeMesh.rotation.z -= delta * 0.1;

            composer.render();
        }

        animate();
    </script>
</body>
</html>
